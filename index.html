<!doctype html>
<html lang="zh-CN" class="silk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#EAE4D7" />
    <title>春信·远岫</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
        --paper: #0a0d12;
        --type: #e9dfc8;
        --muted: #a6aea9;
        --rule: #dad6bf35;
        --seal: #bc6452;
        --active: #e7cb8b;
      }
      :root.silk {
        color-scheme: light;
        --paper: #eae4d7;
        --type: #292e2a;
        --muted: #555e56;
        --rule: #444b403d;
        --seal: #a14d3a;
        --active: #684c27;
      }
      html,
      body,
      main {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--paper);
        color: var(--type);
        font-family: 'Songti SC', 'STSong', 'Noto Serif CJK SC', 'Noto Serif SC', 'SimSun', serif;
        user-select: none;
        -webkit-user-select: none;
      }
      main {
        position: relative;
        isolation: isolate;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
        outline: none;
      }
      .inscription {
        -webkit-mask-image: var(--ink-impression);
        mask-image: var(--ink-impression);
        -webkit-mask-size: 73px 73px;
        mask-size: 73px 73px;
      }
      main::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 48% 48%,
            rgba(27, 24, 37, 0) 37%,
            rgba(27, 24, 37, 0.032) 78%,
            rgba(27, 24, 37, 0.13) 115%
          ),
          linear-gradient(
            161deg,
            rgba(209, 188, 156, 0.019),
            rgba(169, 184, 167, 0.006) 50%,
            rgba(84, 94, 116, 0.031)
          );
      }
      canvas.grabbed {
        cursor: grabbing;
      }
      canvas:focus-visible {
        outline: 1px solid var(--active);
        outline-offset: -4px;
      }
      .inscription {
        position: fixed;
        transform-origin: top left;
        left: max(env(safe-area-inset-left), clamp(24px, 4.8vw, 86px));
        top: max(env(safe-area-inset-top), min(5.7vh, 66px));
        display: grid;
        justify-items: center;
        pointer-events: none;
      }
      h1 {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.07em;
        margin: 0;
        font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', 'Songti SC', 'Noto Serif CJK SC', 'SimSun', serif;
        font-weight: 500;
        font-size: min(5.05vh, 4.2vw, 53px);
        line-height: 1.02;
        color: var(--type);
        transition: color 0.78s;
      }
      h1 i {
        display: block;
        width: 0.084em;
        height: 0.084em;
        border-radius: 50%;
        margin: 0.105em 0 0.14em;
        background: currentColor;
        opacity: 0.76;
      }
      .seal {
        width: min(2.75vh, 24px);
        height: auto;
        margin-top: min(1.35vh, 14px);
        color: var(--seal);
        transform: rotate(-3deg);
        transition: color 0.78s;
      }
      footer {
        position: fixed;
        bottom: max(10px, env(safe-area-inset-bottom));
        left: max(clamp(20px, 4.8vw, 86px), env(safe-area-inset-left));
        right: max(clamp(20px, 4.8vw, 86px), env(safe-area-inset-right));
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: clamp(12px, 1.7vw, 28px);
        pointer-events: none;
      }
      footer::before {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--rule);
        transition: background 0.78s;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.65em;
        min-height: 44px;
        padding: 0 3px;
        border: 0;
        background: transparent;
        color: var(--type);
        font:
          500 14px/1.4 'Songti SC',
          'STSong',
          'Noto Serif CJK SC',
          'SimSun',
          serif;
        letter-spacing: 0.11em;
        cursor: pointer;
        pointer-events: auto;
        -webkit-tap-highlight-color: transparent;
        transition: color 0.78s;
      }
      button:focus-visible {
        outline: 1px solid var(--active);
        outline-offset: 2px;
        border-radius: 2px;
      }
      button svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #theme {
        gap: 0.55em;
      }
      #theme .names {
        display: flex;
        align-items: center;
        gap: 0.46em;
      }
      #theme b {
        font-weight: 500;
        color: var(--muted);
        transition: color 0.78s;
      }
      #theme .selected,
      button:hover,
      #bloom.lit {
        color: var(--active);
      }
      #theme em {
        font-style: normal;
        opacity: 0.42;
        font-size: 12px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 600px) {
        .inscription {
          left: 6.3vw;
          top: max(5.6vh, env(safe-area-inset-top));
        }
        h1 {
          font-size: min(5.05vh, 8.8vw, 42px);
        }
        footer {
          gap: 17px;
        }
        button {
          font-size: 13px;
        }
      }
      @media (max-height: 470px) {
        .inscription {
          top: 4.6vh;
        }
        h1 {
          font-size: min(5.05vh, 26px);
          gap: 0.03em;
        }
        .seal {
          width: min(3vh, 17px);
          margin-top: 1.1vh;
        }
        footer {
          bottom: 1px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before {
          transition-duration: 0.12s !important;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="work">
      <canvas id="scroll" tabindex="0" aria-label="交互山水长卷" aria-describedby="guide">
        春山延绵，彩墨峰影映在江中。
      </canvas>
      <div class="inscription">
        <h1 id="work" aria-label="春信·远岫">
          <span aria-hidden="true">春</span>
          <span aria-hidden="true">信</span>
          <i aria-hidden="true"></i>
          <span aria-hidden="true">远</span>
          <span aria-hidden="true">岫</span>
        </h1>
        <svg class="seal" viewBox="0 0 27 35" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path stroke-width="1.5" d="M2.7 2.2 24 1.6q1 .1.9 2l-.4 28.7-21.8.6-.8-26.7z" />
            <path
              stroke-width="1.35"
              d="m6.5 6.1 13.7-.3M7.9 8.8l10.9-.3M5.9 11.4l15.2-.3M13 4.8c-.1 4.5-2.8 7.5-7.1 9.2m7.8-4.3c1.8 1.9 4.1 3.1 7.5 3.9M9.1 13.2l8.5-.2-.2 4.8-8.4.2zm.3 2.4 7.7-.2M9.7 20.4l-3.6 4.7m2.2-2.7-.2 7.2M15 20l.6 1.5m-4.6.8 10-.2m-8.2 2.3 6.3-.2m-6.4 2 6.3-.1m-6.8 2 7.6-.1-.2 2.7-7.3.2z"
            />
          </g>
        </svg>
      </div>
      <footer aria-label="画卷控制">
        <button id="theme" type="button" aria-label="素绢·明春" aria-pressed="true" title="切换玄墨与素绢">
          <svg viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="7.5" />
            <path fill="currentColor" stroke="none" d="M11 3.5a7.5 7.5 0 0 0 0 15z" />
          </svg>
          <span class="names" aria-hidden="true">
            <b>玄墨</b>
            <em>/</em>
            <b class="selected">素绢</b>
          </span>
        </button>
        <button id="bloom" type="button" title="沿山脊铺开春彩，停驻后渐隐" aria-label="山势流彩">
          <svg viewBox="0 0 22 22" aria-hidden="true">
            <path
              d="M2.3 14.7c3.5-.5 4.2-6.6 7-6.1 1.4.3 1.7 2.1 2.9 1.6 1.7-.7 2.6-6.6 4.4-6.1 1.1.4.4 4.3 3.3 5.3M3.7 17.2c4.9-2.2 8.5 1.8 14.8-.5"
            />
          </svg>
          <span>流彩</span>
        </button>
      </footer>
      <p id="guide" class="sr">
        横向拖动画卷，或滚动滚轮漫游。拂过山脊或江面，点按任意位置激发流彩。键盘左右方向键漫游，空格或回车触发流彩。
      </p>
    </main>
    <script>
      (() => {
        'use strict';
        let canvas = document.querySelector('#scroll');
        const themeButton = document.querySelector('#theme');
        const bloomButton = document.querySelector('#bloom');
        const signature = document.querySelector('.inscription');
        const clock = () => performance.now() / 1000;
        const reduce = matchMedia('(prefers-reduced-motion: reduce)');
        const TAU = 2 * Math.PI,
          PERIOD = 2400,
          FOCUS = 1260,
          CEILING = 352;
        const N = 2048,
          Z = 144,
          FIELD_H = 288,
          PEN_W = 4096,
          PEN_H = 640,
          DEPTH = 296;
        const mod = (x, n) => x - n * Math.floor(x / n);
        const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
        const mix = (a, b, t) => a + (b - a) * t;
        const smooth = (t) => {
          t = clamp(t);
          return t * t * (3 - 2 * t);
        };
        const fold = (x, c) => mod(x - c + PERIOD / 2, PERIOD) - PERIOD / 2;
        function random(seed) {
          return () => {
            seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
            return seed / 4294967296;
          };
        }
        const rng = random(768413),
          lattice = Float32Array.from({ length: 65536 }, rng);
        function noise(x, y, period, seed) {
          const a = x * period,
            i = Math.floor(a),
            j = Math.floor(y),
            u = smooth(a - i),
            v = smooth(y - j);
          const ix = mod(i, period),
            lo = (ix + seed) & 255,
            hi = ((ix + 1 === period ? 0 : ix + 1) + seed) & 255;
          const row = ((j + seed * 13) & 255) << 8,
            next = ((j + 1 + seed * 13) & 255) << 8;
          return mix(
            mix(lattice[row + lo], lattice[row + hi], u),
            mix(lattice[next + lo], lattice[next + hi], u),
            v
          );
        }
        // 织物母版与绘画缓存均使用独立的二维画布。经纬、吃色能力和矿物细砂各占一个通道。
        function offscreen(w, h, read = false) {
          const c =
            typeof OffscreenCanvas === 'function' ? new OffscreenCanvas(w, h) : document.createElement('canvas');
          c.width = w;
          c.height = h;
          return { c, g: c.getContext('2d', { willReadFrequently: read }) };
        }
        const PAINT_W = (window.devicePixelRatio > 1.4 && innerWidth >= 720 ? 6144 : 4096) - 2;
        const LOOM = 1024;
        function wovenSilk() {
          const im = new ImageData(LOOM, LOOM);
          const surfaces = [offscreen(LOOM, LOOM), offscreen(LOOM, LOOM)];
          const impressions = surfaces.map((s) => s.g.createImageData(LOOM, LOOM));
          const rand = random(307241);
          // 两轴都闭合，卷轴任意接缝处的经纬不会错一根线。
          function yarnNoise(x, y, nx, ny, seed) {
            const u = x * nx,
              v = y * ny,
              a = Math.floor(u),
              b = Math.floor(v),
              dx = smooth(u - a),
              dy = smooth(v - b);
            const at = (i, j) => lattice[(mod(j, ny) * 127 + seed * 431 + mod(i, nx) * 331) & 65535];
            return mix(mix(at(a, b), at(a + 1, b), dx), mix(at(a, b + 1), at(a + 1, b + 1), dx), dy);
          }
          const len = LOOM * LOOM,
            height = new Float32Array(len),
            absorb = new Float32Array(len),
            grit = new Float32Array(len);
          const clusters = new Uint8Array(len);
          for (let y = 0; y < LOOM; y++)
            for (let x = 0; x < LOOM; x++) {
              const u = x / LOOM,
                v = y / LOOM,
                i = y * LOOM + x;
              const slubX = yarnNoise(u, v, 47, 6, 17),
                slubY = yarnNoise(u, v, 6, 53, 77);
              const warp = u * 184 + 1.24 * (yarnNoise(u, v, 11, 8, 103) - 0.5) + 0.31 * (slubX - 0.5);
              const weft = v * 214 + 1.13 * (yarnNoise(u, v, 7, 14, 44) - 0.5) + 0.39 * (slubY - 0.5);
              const a = Math.floor(warp),
                b = Math.floor(weft),
                s = warp - a,
                t = weft - b;
              const xt = Math.sin(s * Math.PI) ** (1.7 - 0.72 * slubX),
                yt = Math.sin(t * Math.PI) ** (1.58 - 0.7 * slubY);
              const over = ((a + b) & 1) === 0,
                front = over ? xt : yt,
                rear = over ? yt : xt;
              const grain = rand(),
                twist = 0.065 * Math.sin(TAU * (over ? t * 1.03 + s * 2.08 : s * 1.01 - t * 2.1));
              height[i] = 0.78 * front + 0.26 * rear * (1 - front) + twist + 0.12 * (slubX + 0.7 * slubY - 0.85);
              absorb[i] = clamp(
                0.23 + 0.64 * (1 - front) + 0.18 * (1 - rear) + 0.19 * (grain - 0.5) + 0.13 * (slubX - slubY)
              );
              const gritPatch = yarnNoise(u, v, 117, 97, 62),
                slurry = yarnNoise(u, v, 14, 11, 18);
              grit[i] = clamp(0.54 * grain + 0.32 * gritPatch + 0.14 * slurry);
              // 一到十余像素的颜料絮团与单根经纬分开取样，絮团的毛边来自浆液的横向渗流。
              const fleck = yarnNoise(u + 0.011 * (slurry - 0.5), v + 0.012 * (slubY - 0.5), 64, 47, 31);
              clusters[i] =
                255 *
                clamp(
                  0.5 +
                    0.67 * (fleck - 0.5) +
                    0.55 * (gritPatch - 0.5) +
                    0.38 * (slurry - 0.5) +
                    0.14 * (grain - 0.5)
                );
            }
          for (let y = 0; y < LOOM; y++)
            for (let x = 0; x < LOOM; x++) {
              const i = y * LOOM + x,
                o = i * 4,
                ix = (x - 1) & (LOOM - 1),
                iy = (y - 1) & (LOOM - 1);
              const relief = clamp(
                0.49 +
                  0.42 * (height[i] - 0.57) +
                  0.37 * (height[i] - height[y * LOOM + ix]) +
                  0.21 * (height[i] - height[iy * LOOM + x]) +
                  0.13 * (grit[i] - 0.5)
              );
              im.data[o] = relief * 255;
              im.data[o + 1] = absorb[i] * 255;
              im.data[o + 2] = grit[i] * 255;
              im.data[o + 3] = 255;
              const dark = impressions[0].data,
                light = impressions[1].data;
              for (let ch = 0; ch < 3; ch++) {
                dark[o + ch] = clamp(127 + (relief - 0.49) * 187 + (grit[i] - 0.5) * 45 + [2, 0, 3][ch], 22, 227);
                light[o + ch] = clamp(
                  [247, 244, 235][ch] + (relief - 0.68) * 55 - absorb[i] * 9 + (grit[i] - 0.5) * 16,
                  182,
                  252
                );
              }
              dark[o + 3] = light[o + 3] = 255;
            }
          surfaces.forEach((s, i) => s.g.putImageData(impressions[i], 0, 0));
          return { data: im.data, clusters, ink: surfaces.map((s) => s.c) };
        }
        const cloth = wovenSilk();
        // 同一组织纹控制干笔和印泥在绢面上的断续。此小蒙版只用于题跋和印章。
        function setInscriptionGrain() {
          const c = document.createElement('canvas');
          c.width = c.height = 192;
          const g = c.getContext('2d'),
            im = g.createImageData(c.width, c.height);
          for (let i = 0; i < im.data.length; i += 4) {
            const x = (i >> 2) % 192,
              y = Math.floor((i >> 2) / 192),
              s = ((y + 119) * LOOM + x + 317) * 4;
            const tooth = cloth.data[s + 1] / 255,
              rock = cloth.data[s + 2] / 255;
            im.data[i] = 196;
            im.data[i + 1] = 177;
            im.data[i + 2] = 142;
            im.data[i + 3] = Math.round(
              255 * clamp(0.988 - 0.075 * tooth - 0.48 * smooth((tooth + rock * 0.32 - 0.925) / 0.24))
            );
          }
          g.putImageData(im, 0, 0);
          document.documentElement.style.setProperty('--ink-impression', 'url(' + c.toDataURL('image/png') + ')');
        }
        setInscriptionGrain();
        function fbm(x, y, period, seed) {
          let total = 0,
            weight = 0.556;
          for (let j = 0; j < 4; j++) {
            total += weight * noise(x, y, period, seed + j * 39);
            weight *= 0.48;
            period *= 2;
            y = y * 2 + 0.893;
          }
          return total;
        }
        const washSpecs = [
          { pigment: '赭黄薄底', opacity: 0.16, rim: 0.056, width: 0.84 },
          { pigment: '石绿', opacity: 0.24, rim: 0.083, width: 0.92 },
          { pigment: '胭脂', opacity: 0.23, rim: 0.092, width: 0.77 },
          { pigment: '藤黄', opacity: 0.19, rim: 0.067, width: 0.73 },
          { pigment: '月白', opacity: 0.21, rim: 0.054, width: 0.79 },
          { pigment: '花青回染', opacity: 0.17, rim: 0.079, width: 0.86 }
        ];

        // 脊状多重分形。上一层的脊强控制下一层的权重，横向所有倍频均闭合。
        function ridged(x, y, frequency, seed, octaves = 5) {
          let sum = 0,
            amp = 0.55,
            weight = 1;
          for (let i = 0; i < octaves; i++) {
            const ridge = 1 - Math.abs(noise(x, y, frequency, seed + i * 17) * 2 - 1);
            const signal = ridge * ridge * weight;
            sum += signal * amp;
            weight = clamp(signal * 1.85 + 0.13);
            amp *= 0.5;
            frequency *= 2;
            y = y * 2.04 + 3.7;
          }
          return sum;
        }
        const knots = (text) =>
          text
            .trim()
            .split(/\s+/)
            .map((pair) => pair.split(',').map(Number));
        // 非等距三次 Hermite 曲线，极值处收平，跨卷首尾共用切向。
        function profileCurve(text) {
          const points = knots(text),
            last = points.length - 1;
          const slope = points.map(([x, y], i) => {
            const a =
              i === 0 || i === last
                ? [points[last - 1][0] - (i === 0 ? PERIOD : 0), points[last - 1][1]]
                : points[i - 1];
            const b =
              i === last || i === 0 ? [points[1][0] + (i === last ? PERIOD : 0), points[1][1]] : points[i + 1];
            const l = (y - a[1]) / (x - a[0]),
              r = (b[1] - y) / (b[0] - x);
            return l * r > 0 ? (2 * l * r) / (l + r) : 0;
          });
          return (x) => {
            x = mod(x, PERIOD);
            let l = 0,
              h = last;
            while (h - l > 1) {
              const i = (h + l) >> 1;
              if (points[i][0] <= x) l = i;
              else h = i;
            }
            const [x0, y0] = points[l],
              [x1, y1] = points[h],
              dx = x1 - x0,
              t = (x - x0) / dx;
            return mix(y0, y1, t * t * (3 - 2 * t)) + dx * t * (1 - t) * (slope[l] * (1 - t) - slope[h] * t);
          };
        }
        const curves = [
          profileCurve(
            '0,112 84,148 157,139 230,193 259,190 292,205 345,182 408,198 486,147 549,162 623,112 682,122 749,92 795,109 842,137 895,134 975,174 1033,156 1126,202 1190,190 1276,222 1358,213 1413,248 1456,242 1502,257 1547,225 1614,233 1693,180 1764,192 1832,142 1911,158 2012,134 2110,196 2181,182 2256,144 2318,157 2400,112'
          ),
          profileCurve(
            '0,101 86,124 151,160 198,153 244,191 278,187 315,201 356,184 408,165 454,173 510,139 567,120 614,124 679,83 737,69 788,80 853,92 918,131 955,168 994,165 1029,197 1060,201 1101,230 1154,225 1189,248 1213,249 1246,279 1270,291 1288,299 1310,297 1326,299 1351,271 1376,260 1425,273 1458,262 1503,221 1555,208 1608,193 1662,203 1710,171 1790,143 1872,151 1942,117 2023,150 2090,207 2136,209 2172,192 2240,163 2314,102 2400,101'
          ),
          profileCurve(
            '0,31 93,62 156,60 233,96 272,91 336,113 382,103 444,110 493,88 554,66 604,72 678,40 727,35 797,20 858,22 923,37 977,36 1054,55 1134,42 1198,26 1253,30 1325,44 1371,64 1422,60 1492,86 1529,86 1595,101 1670,81 1738,86 1814,54 1903,47 1976,24 2052,29 2132,60 2200,53 2262,75 2325,55 2400,31'
          )
        ];
        const roots = [
          [55, 232, 341, 420, 596, 803, 993, 1140, 1286, 1448, 1515, 1722, 1900, 2128, 2285],
          [

                  0.5 *
                  (c[axis] -
                    a[axis] +
                    2 * t * (2 * a[axis] - 5 * b[axis] + 4 * c[axis] - d[axis]) +

                  2 * a[axis] -

              band[offset + 2] = Math.min(event.reach, m.arcLength * 0.34) * smooth(elapsed / bloomGrow);

        function uniforms(pipe, time) {

        function drawGPU(time, touch, repaint = true) {

        // 软件绘制复用同一份分染底稿、曲线笔迹和山脊弧长。每一色绢只印一次。
        function surface(w, h, read = false) {
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.ceil(w));
          c.height = Math.max(1, Math.ceil(h));

        const rgb = (c, a = 1) =>

        function makePlates(m) {
          const source = m.prints[0],
            w = source.c.width,
            h = source.c.height,
            density = w / PERIOD;
          const baseScale = clamp((innerHeight * 0.359) / globalPeak, 0.58, 1.8),
            layer = offscreen(w, h),
            lift = offscreen(w, h);
          // 回退路径把同一张提按控制图印在缓存上。这里的墨线与原色版共用透绢蒙版。
          const imprint = layer.g.createImageData(w, h),
            light = lift.g.createImageData(w, h);
          const matte = source.c.getContext('2d').getImageData(0, 0, w, h).data;
          for (let y = 0; y < h; y++)

              const o = (y * w + x) * 4,

            hh = Math.ceil(((m.peak + 2) * ww) / PERIOD);
          m.sheen = [0, 1].map((inv) => {
            const s = offscreen(ww, hh),
              im = s.g.createImageData(ww, hh);
            for (let j = 0; j < hh; j++)
              for (let i = 0; i < ww; i++) {
                const x = ((i + 0.5) / ww) * PERIOD,
                  alt = ((j + 0.5) / ww) * PERIOD,
                  crest = ridgeSample(m.sky, x);
                if (alt > crest) continue;
                const cx = Math.floor((x * PEN_W) / PERIOD),
                  cy = Math.floor((alt * PEN_H) / CEILING),
                  o = (j * ww + i) * 4;
                const val = m.inkData[(cy * PEN_W + cx) * 4];

              }
            s.g.putImageData(im, 0, 0);
            return { c: s.c, h: (hh * PERIOD) / ww };
          });
        }

        function atmosphere(k, stock) {
          const height = 270,
            w = N,
            s = surface(w, height),
            im = s.g.createImageData(w, height);
          for (let i = 0; i < w; i++) {
            const x = (i * PERIOD) / w,
              isCloud = k >= 2;
            const info = isCloud ? mistAt(k - 2, x) : [distant[k][i], 0, 1];
            const [top, thick, amount] = info;
            if (top <= 0) continue;
            const bottom = isCloud ? Math.max(0, Math.floor(top - thick - 1)) : 0;
            const color = isCloud
              ? stock
                ? [0.995, 0.97, 0.89]
                : [0.66, 0.77, 0.744]
              : stock
                ? k
                  ? [0.601, 0.678, 0.612]
                  : [0.662, 0.708, 0.668]
                : k
                  ? [0.206, 0.294, 0.297]

                t = d / Math.max(0.12, thick),
                hem = 1 - smooth(t);

                ? amount *
                  smooth(d + 0.5) *

                    hem * Math.exp(-8 * Math.abs(t - 0.36 - 0.14 * Math.sin(((TAU * x) / PERIOD) * 7))) * 0.1)

                  0.84 *
                  smooth(

        function initSoft() {

        function resizeSoft() {

            ['mirror', W * ratio, water * ratio],
            ['medium', W / 2.25, water / 2.25],

        }
        function across(g, plate, origin, vertical = 1) {

          g.translate(anchor - origin * scale, shore);

        }
        // 两色共用形状和透明度。换绢时先分别印出完整且不透明的景带，再只叠合一次，保持透绢山脚的明度。
        function printSoftLand(time, touch) {
          const transition = mode > 0 && mode < 1;
          const stocks = transition ? [0, 1] : [mode < 0.5 ? 0 : 1];
          const targets = transition ? [soft.land.g, soft.alternate.g] : [soft.land.g];
          const moving = mod(phase(0.25) + (reduce.matches ? 0 : time * 1.65), PERIOD);

        function softwareGlow(m, touch) {

            mask = soft.mask,

        function softSky(g, stock = mode) {

        function drawSoft(time, touch, repaint = true) {

            for (let px = 0; px < canvas.width; px += stride) {

        let lastPrint = -10,
          wasLit = false;
        function tick(ms) {
          frame = 0;
          if (lost || document.hidden) return;
          const time = ms / 1000,
            dt = previous ? clamp(time - previous, 0, 0.06) : 1 / 60;
          previous = time;
          if (lastDpr !== (window.devicePixelRatio || 1) || canvas.clientWidth !== W || canvas.clientHeight !== H)
            resize();
          if (!W || !H) {
            frame = requestAnimationFrame(tick);
            return;
          }
          const lastCam = camera,
            oldYaw = yaw,
            oldMode = mode;
          mode = mix(modeFrom, modeGoal, smooth((time - modeStart) / (reduce.matches ? 0.14 : 0.78)));
          camera = mix(camera, destination, 1 - Math.exp(-dt * (drag ? 38 : 17)));
          if (Math.abs(camera - destination) < 0.006) camera = destination;
          if (camera !== lastCam) frameLandscape();
          const aim =
            0.14 * Math.sin((camera / PERIOD) * TAU * 0.4) + clamp((destination - camera) * 0.0033, -0.24, 0.24);
          yaw = mix(yaw, aim, 1 - Math.exp(-dt * 8));
          if (Math.abs(aim - yaw) < 0.0003) yaw = aim;
          waves = waves.filter((e) => time - e.time < bloomEnd);
          if (waves.length || wasLit) updateBloomBands(time);
          wakes = wakes.filter((e) => time - e.time < 0.88);
          if (!waves.length) bloomButton.classList.remove('lit');
          const touch = 1 - smooth((time - hover.time - 0.035) / 0.57);
          const hasLight = !!(touch || waves.length);
          const movingInk = lastCam !== camera || oldYaw !== yaw || oldMode !== mode || hasLight || wasLit;
          const repaint = dirty || movingInk || (!reduce.matches && time - lastPrint > 0.045);
          if (repaint) lastPrint = time;
          wasLit = hasLight;
          if (gpu) drawGPU(time, touch, repaint);
          else drawSoft(time, touch, repaint);
          dirty = false;
          frame = requestAnimationFrame(tick);
        }
        function start() {
          if (!frame && !lost && !document.hidden) {
            previous = 0;
            frame = requestAnimationFrame(tick);
          }
        }
        themeButton.addEventListener('click', () => {
          modeFrom = mode;
          modeGoal = 1 - modeGoal;
          modeStart = clock();
          document.documentElement.classList.toggle('silk', !!modeGoal);
          themeButton.setAttribute('aria-pressed', String(!!modeGoal));
          themeButton.querySelectorAll('b').forEach((b, i) => b.classList.toggle('selected', i === modeGoal));
          document.querySelector('meta[name=theme-color]').content = stockColors[modeGoal][8];
          dirty = true;
        });
        function bloomAtRidge() {
          const m = mountains[1],
            x = W * 0.63,
            h = ridgeSample(m.sky, phase(m.rate) + (x - anchor) / scale);
          release(x, shore - h * scale);
        }
        bloomButton.addEventListener('click', bloomAtRidge);
        function bindCanvas() {
          canvas.addEventListener('pointerdown', (e) => {
            if (!e.isPrimary || e.button !== 0) return;
            canvas.focus({ preventScroll: true });
            canvas.setPointerCapture(e.pointerId);
            drag = {
              id: e.pointerId,
              x: e.clientX,
              y: e.clientY,
              last: e.clientX,
              lastTime: clock(),
              velocity: 0,
              moved: false
            };
            destination = camera;
          });
          canvas.addEventListener('pointermove', (e) => {
            if (!e.isPrimary) return;
            const time = clock(),
              x = e.clientX,
              y = e.clientY;
            if (drag && drag.id === e.pointerId) {
              if (!drag.moved && Math.hypot(x - drag.x, y - drag.y) > 4) {
                drag.moved = true;
                canvas.classList.add('grabbed');
              }
              if (drag.moved) {
                const dx = x - drag.last,
                  dt = Math.max(0.01, time - drag.lastTime);
                destination -= dx / scale;
                drag.velocity = mix(drag.velocity, -dx / (scale * dt), 0.56);
                drag.last = x;
                drag.lastTime = time;
                if (y > bankAt(x)) wake(x, y, time);
                return;
              }
            }
            brush(x, y, time);
          });
          function endDrag(e, cancel) {
            if (!drag || e.pointerId !== drag.id) return;
            const ended = drag;
            drag = null;
            canvas.classList.remove('grabbed');
            if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
            if (cancel) return;
            if (!ended.moved) {
              release(e.clientX, e.clientY);
              if (e.clientY > bankAt(e.clientX)) wake(e.clientX, e.clientY, clock());
            } else if (!reduce.matches && clock() - ended.lastTime < 0.09)
              destination += clamp(ended.velocity, -1650, 1650) * 0.115;
          }
          canvas.addEventListener('pointerup', (e) => endDrag(e, false));
          canvas.addEventListener('pointercancel', (e) => endDrag(e, true));
          canvas.addEventListener('lostpointercapture', (e) => endDrag(e, true));
          canvas.addEventListener(
            'wheel',
            (e) => {
              if (e.ctrlKey) return;
              e.preventDefault();
              const step = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? W : 1;
              const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
              destination += (d * step) / scale;
            },
            { passive: false }
          );
          canvas.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
              e.preventDefault();
              destination += ((e.key === 'ArrowLeft' ? -1 : 1) * W * 0.12) / scale;
            }
            if (e.key === ' ' || e.key === 'Enter') {
              e.preventDefault();
              if (!e.repeat) bloomAtRidge();
            }
          });
          canvas.addEventListener('webglcontextlost', (e) => {
            e.preventDefault();
            lost = true;
            cancelAnimationFrame(frame);
            frame = 0;
          });
          canvas.addEventListener('webglcontextrestored', () => {
            initializeRenderer();
            if (!gpu) bindCanvas();
            lost = false;
            resize();
            start();
          });
        }
        function initializeRenderer() {
          if (gl) {
            try {
              initGPU();
              return;
            } catch (error) {
              console.info(error.message);
              const replacement = canvas.cloneNode(true);
              canvas.replaceWith(replacement);
              canvas = replacement;
              gl = null;
              gpu = null;
            }
          }
          initSoft();
        }
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            cancelAnimationFrame(frame);
            frame = 0;
          } else {
            dirty = true;
            start();
          }
        });
        document.fonts?.ready.then(fitSignature);
        initializeRenderer();
        bindCanvas();
        resize();
        start();
      })();
    </script>
  </body>
</html>
